        <article class="report-body prose">
          <figure class="table-wrap"><table><tbody><tr><td><p><img src="../images/reports/942-u_AllanAtTWH19.jpg" alt="Allan"></p></td><td><p>Allan Lee was third and first M40 at the Whitstable 10k on Bank Holiday Monday 6th May, where Chris Hall also had a great run in 29th. The SAC results were:</p><table><thead><tr><th>Pos</th><th>Name</th><th>Cat</th><th>Chip</th></tr></thead><tbody><tr><td>3</td><td>Allan Lee</td><td>MV40</td><td>33:45</td></tr><tr><td>29</td><td>Chris Hall</td><td>MV40</td><td>41:02</td></tr></tbody></table></figure>
          <p>The full results are <a href="https://www.whitstable10k.org.uk/W10K_result.php?yr=2019&amp;pageID=1">here</a>.</p>
          </td></tr></tbody></table>
          <figure class="report-photo"><img src="../images/reports/942-u_Heather_JimAtTP10k2019.jpg" alt="Heather &amp; Jim"></figure>
          <p>Meanwhile, Andrew Mead was 20th and 4th M50 at the Ted Pepper 10k at Norman Park, Bromley, with Heather Fitzmaurice, Laura Andrade and Jim Fitzmaurice also running well. Heather took the W45 and Jim the M75 SCVAC multi-terrain title. The SAC results were:</p>
          <figure class="table-wrap"><table><tbody><tr><th>Pos</th><th>Gun</th><th>Chip</th><th>Name</th><th>Club</th><th>Sex</th><th>Cat</th><th>Num</th><th>GPos</th><th>GCat</th></tr><tr><td>20</td><td>00:40:11</td><td>00:40:08</td><td>Andrew Mead</td><td>Sevenoaks AC</td><td>M</td><td>Male Vet 50</td><td>243</td><td>20</td><td>4</td></tr><tr><td>82</td><td>00:45:49</td><td>00:45:43</td><td>Heather Fitzmaurice</td><td>Sevenoaks AC</td><td>F</td><td>Female Vet 45</td><td>137</td><td>17</td><td>7</td></tr><tr><td>99</td><td>00:47:25</td><td>00:47:11</td><td>Laura Andrade</td><td>Sevenoaks AC</td><td>F</td><td>Female Vet 35</td><td>10</td><td>21</td><td>8</td></tr><tr><td>303</td><td>01:03:10</td><td>01:03:04</td><td>james fitzmaurice</td><td>Sevenoaks AC</td><td>M</td><td>Male Vet 60</td><td>136</td><td>187</td><td>27</td></tr></tbody></table></figure>
          <p>The Ted Pepper results are <a href="https://www.nice-work.org.uk/races/index.php?url=TedPepper10k/2019">here</a>.</p>
          <p>Sevenoaks AC also had four runners in both the Hildenborough 10 and 5 milers, with Lionel Stielow 1st M70 in the longer race:</p>
